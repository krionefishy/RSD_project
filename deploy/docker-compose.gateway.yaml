# Gateway stack — ONE Nginx on ports 80/443 that routes by domain:
#   rsdobin.ru     → prod stack  (rsd-prod-nginx container)
#   rsdobin.online → demo1 stack (rsd-demo1-nginx container)
#
# The rsd_gateway Docker network must exist before starting:
#   just gateway-network
#
# First-time SSL setup:
#   just gateway-init          # start with HTTP-only, serve ACME challenges
#   just gateway-certonly-prod # get cert for rsdobin.ru
#   just gateway-certonly-demo # get cert for rsdobin.online
#   just gateway-up            # restart with full HTTPS config
#
# Normal (certs already exist):
#   just gateway-up

name: rsd-gateway

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: rsd-gateway-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/gateway.conf:/etc/nginx/conf.d/gateway.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/nginx/certs:ro
    networks:
      - rsd_gateway

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    profiles:
      - certonly
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  rsd_gateway:
    name: rsd_gateway
    external: true
