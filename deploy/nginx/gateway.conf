# Gateway Nginx — routes rsdobin.ru → prod, rsdobin.online → demo
# SSL termination happens here; internal nginx services serve plain HTTP.
#
# Prerequisites (run once on server):
#   just gateway-certonly-prod   # get cert for rsdobin.ru
#   just gateway-certonly-demo   # get cert for rsdobin.online
# Then: just gateway-up

upstream prod_app {
    server rsd-prod-nginx:80;
}

upstream demo_app {
    server rsd-demo1-nginx:80;
}

# HTTP → HTTPS redirect for both domains + ACME challenge
server {
    listen 80;
    listen [::]:80;
    server_name rsdobin.ru rsdobin.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── PROD — rsdobin.ru ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rsdobin.ru;

    ssl_certificate     /etc/nginx/certs/live/rsdobin.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/rsdobin.ru/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL_prod:10m;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options       SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff   always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20m;

    location / {
        proxy_pass         http://prod_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }
}

# ── DEMO — rsdobin.online ────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rsdobin.online;

    ssl_certificate     /etc/nginx/certs/live/rsdobin.online/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/rsdobin.online/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL_demo:10m;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options       SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff   always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20m;

    location / {
        proxy_pass         http://demo_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }
}
