environment: demo
log_level: INFO

database:
  host: localhost
  port: 5432
  user: app
  password: appsecret
  database: rsd_db
  echo: false

main_replica_database:
  enabled: false

backend:
  jwt:
    secret: demo-user-jwt-secret-not-for-production-32
    algorithm: HS256
    access_expire_seconds: 3600
    refresh_expire_seconds: 86400
    rsa_private_key_pem: null
    rsa_key_size: 2048
  redis:
    host: localhost
    port: 6379
    db: 0
  kafka:
    bootstrap_servers: localhost:9092
    consumer_group: rsd-backend-demo-group
    max_request_size: 10485760
  s3:
    endpoint_url: http://localhost:9000
    tenant_id: ""
    key_id: minioadmin
    secret_key: minioadmin
    bucket_name: rsd-bucket
    region: ru-central-1
    verify: false

inter_service_auth:
  jwt:
    secret: demo-inter-service-secret-not-for-production
    algorithm: HS256
    issuer: rsd-backend
    audience: rsd-report-service
    expire_seconds: 300
    allowed_subjects:
      - backend

services:
  report_service:
    enabled: true
    base_url: http://localhost:8001
    timeout_seconds: 120

report_service:
  database:
    host: localhost
    port: 5432
    user: app
    password: appsecret
    database: rsd_reports
    echo: false
  kafka:
    consumer_group: rsd-report-service-demo-group
