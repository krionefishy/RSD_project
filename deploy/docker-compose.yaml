services:
  nginx:
    image: nginx:1.27-alpine
    container_name: rsd-prod-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    networks:
      - proxy
      - rsd_gateway
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/internal.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=${POSTGRES_MAX_WAL_SENDERS:-10}"
      - "-c"
      - "max_replication_slots=${POSTGRES_MAX_REPLICATION_SLOTS:-10}"
      - "-c"
      - "wal_keep_size=${POSTGRES_WAL_KEEP_SIZE:-1024MB}"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-100}"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}"
      - "-c"
      - "work_mem=${POSTGRES_WORK_MEM:-16MB}"
      - "-c"
      - "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}"
      - "-c"
      - "checkpoint_timeout=${POSTGRES_CHECKPOINT_TIMEOUT:-10min}"
      - "-c"
      - "log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_STATEMENT:-500ms}"
      - "-c"
      - "log_checkpoints=on"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: appsecret
      POSTGRES_DB: rsd_db
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replicatorsecret}
      MAIN_REPLICA_READONLY_USER: ${MAIN_REPLICA_READONLY_USER:-report_reader}
      MAIN_REPLICA_READONLY_PASSWORD: ${MAIN_REPLICA_READONLY_PASSWORD:-reportreadersecret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../deploy/docker/init-main-db.sh:/docker-entrypoint-initdb.d/20-init-main-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d rsd_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  db_replica:
    image: postgres:15-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    environment:
      PRIMARY_HOST: db
      PRIMARY_PORT: 5432
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replicatorsecret}
      POSTGRES_SHARED_BUFFERS: ${REPLICA_POSTGRES_SHARED_BUFFERS:-256MB}
      POSTGRES_WORK_MEM: ${REPLICA_POSTGRES_WORK_MEM:-8MB}
      POSTGRES_MAINTENANCE_WORK_MEM: ${REPLICA_POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
      POSTGRES_EFFECTIVE_CACHE_SIZE: ${REPLICA_POSTGRES_EFFECTIVE_CACHE_SIZE:-1GB}
      POSTGRES_MAX_CONNECTIONS: ${REPLICA_POSTGRES_MAX_CONNECTIONS:-100}
      POSTGRES_LOG_MIN_DURATION_STATEMENT: ${REPLICA_POSTGRES_LOG_MIN_DURATION_STATEMENT:-500ms}
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ../deploy/docker/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d rsd_db"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - internal

  report_db:
    image: postgres:15-alpine
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "max_connections=${REPORT_POSTGRES_MAX_CONNECTIONS:-50}"
      - "-c"
      - "shared_buffers=${REPORT_POSTGRES_SHARED_BUFFERS:-256MB}"
      - "-c"
      - "work_mem=${REPORT_POSTGRES_WORK_MEM:-8MB}"
      - "-c"
      - "maintenance_work_mem=${REPORT_POSTGRES_MAINTENANCE_WORK_MEM:-128MB}"
      - "-c"
      - "effective_cache_size=${REPORT_POSTGRES_EFFECTIVE_CACHE_SIZE:-1GB}"
      - "-c"
      - "checkpoint_timeout=${REPORT_POSTGRES_CHECKPOINT_TIMEOUT:-10min}"
      - "-c"
      - "log_min_duration_statement=${REPORT_POSTGRES_LOG_MIN_DURATION_STATEMENT:-500ms}"
      - "-c"
      - "log_checkpoints=on"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
    environment:
      POSTGRES_USER: ${REPORT_DB_SUPERUSER:-report_admin}
      POSTGRES_PASSWORD: ${REPORT_DB_SUPERUSER_PASSWORD:-reportadminsecret}
      POSTGRES_DB: ${REPORT_DB_NAME:-rsd_reports}
      REPORT_DB_APP_USER: ${REPORT_DB_APP_USER:-report_service}
      REPORT_DB_APP_PASSWORD: ${REPORT_DB_APP_PASSWORD:-reportsecret}
    volumes:
      - report_postgres_data:/var/lib/postgresql/data
      - ../deploy/docker/init-report-service-db.sh:/docker-entrypoint-initdb.d/20-init-report-service-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REPORT_DB_APP_USER:-report_service} -d ${REPORT_DB_NAME:-rsd_reports}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - internal

  kafka:
    image: apache/kafka:latest
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_MESSAGE_MAX_BYTES: 25165824
      KAFKA_REPLICA_FETCH_MAX_BYTES: 25165824
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - internal

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_DEMO_MODE: "false"
        VITE_PRESENTATION_MODE: "false"
        VITE_MOCK_AUTH: "false"
        VITE_MOCK_KB: "false"
    restart: unless-stopped
    networks:
      - proxy

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      CONFIG_PATH: /backend/shared/settings/config.production.yaml
    networks:
      - proxy
      - internal
    depends_on:
      db:
        condition: service_healthy
      db_replica:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      report_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 60s
      timeout: 5s
      retries: 3

  report_service:
    build:
      context: ..
      dockerfile: backend/report_service/Dockerfile
    restart: unless-stopped
    environment:
      CONFIG_PATH: /service/shared/settings/config.production.yaml
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
      db_replica:
        condition: service_started
      report_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  postgres_replica_data:
  report_postgres_data:
  redis_data:

networks:
  proxy:
    name: rsd-prod-proxy
    driver: bridge
  internal:
    name: rsd-prod-internal
    driver: bridge
    internal: true
  rsd_gateway:
    name: rsd_gateway
    external: true
