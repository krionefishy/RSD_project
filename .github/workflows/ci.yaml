name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yaml"
      - "docker-compose.ci.yaml"
      - "justfile"
      - "migrations/**"
      - "pytest.ini"
      - "alembic.ini"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yaml"
      - "docker-compose.ci.yaml"
      - "justfile"
      - "migrations/**"
      - "pytest.ini"
      - "alembic.ini"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://app:appsecret@localhost:5432/rsd_test_db
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Start database
        run: |
          docker compose -f docker-compose.ci.yaml up -d
          timeout 20s bash -c 'until docker compose -f docker-compose.ci.yaml exec -T db pg_isready -U app; do sleep 2; done'
          docker compose -f docker-compose.ci.yaml exec -T db createdb -U app rsd_test_db 2>/dev/null || true

      - name: Apply migrations
        run: just ci-migrate

      - name: Run tests
        run: just ci-test-run

      - name: Stop database
        if: always()
        run: docker compose -f docker-compose.ci.yaml down --remove-orphans
