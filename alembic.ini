[alembic]
# path to migration scripts (как в Barista_KPI_project)
script_location = migrations

prepend_sys_path = .

version_path_separator = os

# Для offline-режима; в online используется DATABASE_URL из окружения
sqlalchemy.url = postgresql+asyncpg://app:appsecret@localhost:5432/audit_trail_db


[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
