# Gateway HTTP-only config — used BEFORE SSL certificates are obtained.
# Run: just gateway-init
# This config serves ACME challenges and shows a temporary 503 on HTTPS.
# After getting certs run: just gateway-up  (switches to gateway.conf with SSL)

upstream prod_app {
    server rsd-prod-nginx:80;
}

upstream demo_app {
    server rsd-demo1-nginx:80;
}

server {
    listen 80;
    listen [::]:80;
    server_name rsdobin.ru rsdobin.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503;
    }
}
