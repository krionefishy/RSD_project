name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yaml"
      - "docker-compose.ci.yaml"
      - "pytest.ini"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yaml"
      - "docker-compose.ci.yaml"
      - "pytest.ini"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Start database
        run: |
          docker compose -f docker-compose.ci.yaml up -d
          timeout 20s bash -c 'until docker compose -f docker-compose.ci.yaml exec -T db pg_isready -U app -d rsd_test_db; do sleep 2; done'

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://app:appsecret@localhost:5432/rsd_test_db
          CONFIG_PATH: backend/shared/settings/config.test.yaml
        run: pytest --cov=backend --cov-report=term-missing

      - name: Stop database
        if: always()
        run: docker compose -f docker-compose.ci.yaml down --remove-orphans
