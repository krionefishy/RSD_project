# Presentation demo: nginx + frontend only (mock data, no backend/db/kafka).
#
# Requires: deploy/.env.production (domain + SSL paths), certbot certs.
# Stop production stack first if it uses ports 80/443:
#   docker compose --env-file deploy/.env.production -f deploy/docker-compose.yaml down
#
# Start:
#   docker compose --env-file deploy/.env.production -f deploy/docker-compose.demo.yaml up -d --build

name: rsd-demo

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-rsdobin.ru}
      SSL_CERT_PATH: ${SSL_CERT_PATH:-/etc/nginx/certs/live/rsdobin.ru/fullchain.pem}
      SSL_CERT_KEY_PATH: ${SSL_CERT_KEY_PATH:-/etc/nginx/certs/live/rsdobin.ru/privkey.pem}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/demo.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/nginx/certs:ro

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_DEMO_MODE: "true"
        VITE_PRESENTATION_MODE: "true"
        VITE_MOCK_AUTH: "true"
        VITE_MOCK_KB: "true"
        VITE_API_URL: /api/v1
    restart: unless-stopped
