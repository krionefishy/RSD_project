environment: docker
log_level: INFO

database:
  host: db
  port: 5432
  user: app
  password: appsecret
  database: rsd_db
  echo: false

main_replica_database:
  enabled: true
  host: db_replica
  port: 5432
  user: report_reader
  password: reportreadersecret
  database: rsd_db
  echo: false

backend:
  jwt:
    secret: docker-dev-user-jwt-secret-change-me-32
    algorithm: HS256
    access_expire_seconds: 3600
    refresh_expire_seconds: 604800
    rsa_private_key_pem: null
    rsa_key_size: 2048
  redis:
    host: redis
    port: 6379
    db: 0
  kafka:
    bootstrap_servers: kafka:9092
    consumer_group: rsd-backend-docker-group
    max_request_size: 10485760
  s3:
    endpoint_url: http://minio:9000
    tenant_id: ""
    key_id: minioadmin
    secret_key: minioadmin
    bucket_name: rsd-bucket
    region: ru-central-1
    verify: false

inter_service_auth:
  jwt:
    secret: docker-inter-service-secret-change-me-32chars
    algorithm: HS256
    issuer: rsd-backend
    audience: rsd-report-service
    expire_seconds: 300
    allowed_subjects:
      - backend

services:
  report_service:
    enabled: true
    base_url: http://report_service:8000
    timeout_seconds: 120

report_service:
  database:
    host: report_db
    port: 5432
    user: report_service
    password: reportsecret
    database: rsd_reports
    echo: false
  kafka:
    consumer_group: rsd-report-service-docker-group
