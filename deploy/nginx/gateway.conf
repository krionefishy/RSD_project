# Gateway Nginx — routes rsdobin.ru to the production stack.
# Uses Docker's internal DNS resolver (127.0.0.11) with runtime resolution
# so nginx doesn't fail to start if upstream containers aren't ready yet.

resolver 127.0.0.11 valid=10s ipv6=off;

# HTTP → HTTPS redirect + ACME challenge
server {
    listen 80;
    listen [::]:80;
    server_name rsdobin.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── PROD — rsdobin.ru ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rsdobin.ru;

    ssl_certificate     /etc/nginx/certs/live/rsdobin.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/rsdobin.ru/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL_prod:10m;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options       SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff   always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20m;

    set $prod_upstream rsd-prod-nginx;

    location / {
        proxy_pass         http://$prod_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }
}
