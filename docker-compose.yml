version: "3.8"

services:
  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_MESSAGE_MAX_BYTES: 10485760
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 15s

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-appsecret}
      POSTGRES_DB: ${DB_NAME:-audit_trail_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-audit_trail_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  users_service:
    build:
      context: backend
      dockerfile: users_service/Dockerfile
    environment:
      DATABASE_URL: postgresql://${DB_USER:-app}:${DB_PASSWORD:-appsecret}@${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-audit_trail_db}
      CONFIG_PATH: /app/config.yaml
    volumes:
      - ./backend/users_service/config.yaml:/app/config.yaml
    depends_on:
      db:
        condition: service_healthy

  checklists_service:
    build:
      context: backend
      dockerfile: checklists_service/Dockerfile
    environment:
      DATABASE_URL: postgresql://${DB_USER:-app}:${DB_PASSWORD:-appsecret}@${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-audit_trail_db}
      CONFIG_PATH: /app/config.yaml
    volumes:
      - ./backend/checklists_service/config.yaml:/app/config.yaml
    depends_on:
      db:
        condition: service_healthy

  reports_service:
    build:
      context: backend
      dockerfile: reports_service/Dockerfile
    environment:
      DATABASE_URL: postgresql://${DB_USER:-app}:${DB_PASSWORD:-appsecret}@${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-audit_trail_db}
      CONFIG_PATH: /app/config.yaml
    volumes:
      - ./backend/reports_service/config.yaml:/app/config.yaml
    depends_on:
      db:
        condition: service_healthy

  organizations_service:
    build:
      context: backend
      dockerfile: organizations_service/Dockerfile
    environment:
      DATABASE_URL: postgresql://${DB_USER:-app}:${DB_PASSWORD:-appsecret}@${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-audit_trail_db}
      CONFIG_PATH: /app/config.yaml
    volumes:
      - ./backend/organizations_service/config.yaml:/app/config.yaml
    depends_on:
      db:
        condition: service_healthy

  admin_service:
    build:
      context: backend
      dockerfile: admin_service/Dockerfile
    environment:
      DATABASE_URL: postgresql://${DB_USER:-app}:${DB_PASSWORD:-appsecret}@${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-audit_trail_db}
      CONFIG_PATH: /app/config.yaml
    volumes:
      - ./backend/admin_service/config.yaml:/app/config.yaml
    depends_on:
      db:
        condition: service_healthy

  storage_service:
    build:
      context: backend
      dockerfile: storage_service/Dockerfile
    environment:
      CONFIG_PATH: /app/config.yaml
      SHARED_CONFIG_PATH: /app/shared_config.yaml
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./backend/storage_service/config.yaml:/app/config.yaml
      - ./backend/shared/config/default.yaml:/app/shared_config.yaml
    depends_on:
      kafka:
        condition: service_healthy

  api_gateway:
    build:
      context: backend
      dockerfile: api_gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      CONFIG_PATH: /app/config.yaml
      USERS_SERVICE_URL: http://users_service:8000
      CHECKLISTS_SERVICE_URL: http://checklists_service:8000
      REPORTS_SERVICE_URL: http://reports_service:8000
      ORGANIZATIONS_SERVICE_URL: http://organizations_service:8000
      ADMIN_SERVICE_URL: http://admin_service:8000
    volumes:
      - ./backend/api_gateway/config.yaml:/app/config.yaml
    depends_on:
      - users_service
      - checklists_service
      - reports_service
      - organizations_service
      - admin_service

volumes:
  pgdata:
