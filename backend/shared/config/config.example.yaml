# Пример конфигурации для локальной разработки
# Скопируйте в config.yaml и настройте под свое окружение

# База данных
database:
  host: localhost          # Для Docker: db
  port: 5432
  user: app
  password: appsecret
  database: rsd_db

# Логирование
logging:
  level: INFO

# Kafka
kafka:
  bootstrap_servers: localhost:9092   # Для Docker: kafka:9092
  client_id: dev-service

# Redis
redis:
  host: localhost          # Для Docker: redis
  port: 6379
  password: ""
  db: 0

# URL микросервисов
services:
  gateway_url: http://localhost:8000
  auth_service_url: http://localhost:8001
  knowledge_base_service_url: http://localhost:8002

# Безопасность (ОБЯЗАТЕЛЬНО изменить в production!)
security:
  jwt_secret: dev-secret-key-change-in-production
  jwt_algorithm: HS256
  access_token_expire_minutes: 30
  refresh_token_expire_days: 7
